<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel='stylesheet' href='style.css'/>
  </head>
  <body>
    <div class="container">
        <div class="sidebar">
        <div class="title">
          <img src="./img/axe-battle.svg">
          <h2>Dashboard</h2>
        </div>
        <div class="set1">
          <div><img src="./img/home-analytics.svg">
          <a href="">Home</a></div>
          <div><img src="./img/card-account-details.svg">
          <a href="">Profile</a></div>
          <div><img src="./img/message.svg">
          <a href="">Messages</a></div>
          <div><img src="./img/history.svg">
          <a href="">History</a></div>
          <div><img src="./img/abacus.svg">
          <a href="">Tasks</a></div>
          <div><img src="./img/account-group-outline.svg">
          <a href="">Communities</a></div>
        </div>
        <div class="set2">
          <div><img src="./img/cog.svg">
          <a href="">Settings</a></div>
          <div><img src="./img/face-agent.svg">
          <a href="">Support</a></div>
          <div><img src="./img/eye-check.svg">
          <a href="">Privacy</a></div>
        </div>
      </div>
      <div class="topbar">
        <div class="row1">
          <div class="search"><img src="./img/magnify.svg">
          <form action="/search" method="get">
            <label for="searchbar"></label>
            <input type="search" id="searchbar" name="search">
          </form></div>
          <div class="side-icons"><img src="./img/bell-ring-outline.svg">
          <img class="avatar" src="./img/trfelix-3597b9.svg">
          <h3>Sam Lau</h3></div>
        </div>
        <div class="row2">
          <div class="greetings">
            <img src="./img/trfelix-3597b9.svg">
            <div class="textpart"><span class="greeting-small">Hi there,</span>
    <span class="greeting-name">Sam Lau (@sam)</span></div>
          </div>
          <div class="buttons">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
